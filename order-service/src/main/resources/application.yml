server:
  port: ${PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/orders}
    username: ${DB_USER:booking}
    password: ${DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

catalog:
  base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}

messaging:
  exchange: booking.events

orders:
  simulator:
    enabled: ${SIMULATE_FULFILLMENT:true}
    confirm-after: 5s
    complete-after: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
